name: Loupe
options:
  bundleIdPrefix: com.loupe-ai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Signing: DEVELOPMENT_TEAM comes from Config/Signing.xcconfig, which includes the git-ignored
# Config/Signing.local.xcconfig when present (template: Signing.local.xcconfig.example). Do not set
# DEVELOPMENT_TEAM below — project settings would override the xcconfig. See ios/README.md.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  Loupe:
    type: application
    platform: iOS
    sources:
      # The font OFL texts (Resources/Fonts/*.txt) ship as resources: Me → Licences shows them.
      - path: Loupe
      # The "Send to Loupe" inbox helpers, shared with the Share Extension (epic #7 child 7).
      - path: Shared
      # The widget's "Check copied" intent (2026-09-26, clipboard checks): compiled into the app too, so
      # iOS can run it in the app (it opens Loupe) as well as in the widget.
      - path: LoupeWidgets/CheckCopiedIntent.swift
      # Notices for the native code Laya brings (ORT iOS, the tokenizers crates), generated by
      # :backend-laya-common:generateIosThirdPartyNotices. Bundled from its one source of truth.
      - path: ../ios-native/THIRD_PARTY_NOTICES-ios.txt
        buildPhase: resources
      # The synthetic sample (epic #7 child 2): the desktop's sample resources, verbatim, bundled as
      # a folder named "sample" and read by the Sources tab. Labelled "not from your phone" in the UI.
      - path: ../sources-desktop/src/main/resources/dev/loupe/sources/sample
        type: folder
        buildPhase: resources
      # The example preset pack (epic #7 child 14), copied verbatim from Loupe Station and bundled as
      # a folder named "packs". Business-specific (Bistro Cloud), so the app labels it an example.
      - path: ../examples/packs
        type: folder
        buildPhase: resources
    dependencies:
      # The engine and Laya for iOS, consumed as the KMP-built XCFramework (static). It embeds ONNX
      # Runtime and the Rust tokenizer (cinterop static libraries), so their xcframeworks are not
      # linked again. Build it first (after ios-native/build.sh):
      #   ./gradlew :loupe-kit:assembleLoupeKitDebugXCFramework
      - framework: ../loupe-kit/build/XCFrameworks/debug/LoupeKit.xcframework
        embed: false
      # "Send to Loupe" (epic #7 child 7), embedded in the app.
      - target: LoupeShare
      # Loupe for Safari (2026-09-26, browsing protection): a Safari Web Extension, embedded in the app.
      - target: LoupeSafari
      # Clipboard checks (2026-09-26): the Loupe keyboard and the "Check copied" widget, embedded in the app.
      - target: LoupeKeyboard
      - target: LoupeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios
        # App Group group.com.loupe-ai.ios: the Share Extension's inbox. A device build needs it
        # registered on the owner's Apple developer account (owner-blocked, docs/BUILD.md).
        CODE_SIGN_ENTITLEMENTS: Loupe/Loupe.entitlements
        PRODUCT_NAME: Loupe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        # LoupeKit ships arm64 only (device + Apple-silicon simulator); no x86_64 simulator slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
        # Gmail sign-in (Gmail API, gmail.readonly): the owner's iOS OAuth client. iOS clients have no
        # secret and the ID is public. The scheme is the reversed client ID Google redirects to.
        # Empty both to build without Google sign-in (the Mail screen then says it needs a client ID).
        GOOGLE_IOS_CLIENT_ID: 149960832358-7i7bc56cuof9q91mhut306f35k0jgvi2.apps.googleusercontent.com
        GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.149960832358-7i7bc56cuof9q91mhut306f35k0jgvi2
      configs:
        # DEBUG-only fixture offers (-LoupeFixtures) never ship: Release leaves the file out of
        # every build phase, and the code that reads it is #if DEBUG. The same for the Diagnostics
        # parity fixture (Me → Diagnostics is #if DEBUG || LOUPE_DIAGNOSTICS); a TestFlight
        # diagnostics archive overrides both settings (ios/scripts/device-build.sh --diagnostics-archive).
        # Flights is DEVELOPMENT-ONLY until Duffel grants permission (owner decision 2026-09-25: its
        # Services Agreement bans metasearch §2.5(d) and third-party access §2.5(e)). Only Debug defines
        # LOUPE_FLIGHTS_DEV, so a Release build has no Flights template (LoupeTests/WebLibraryTests checks this).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG LOUPE_FLIGHTS_DEV"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: ["flights-lis-lhr.json", "laya-diagnostics.json", "search-currency.json", "search-weather.json", "search-uk-trains.json"]
    info:
      path: Loupe/Info.plist
      properties:
        CFBundleDisplayName: Loupe
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Rajdhani-SemiBold.ttf
          - Rajdhani-Bold.ttf
          - JetBrainsMono.ttf
        ITSAppUsesNonExemptEncryption: false
        # "Open in Loupe" for preset packs (.json) from Files and the share sheet (epic #7 child 14).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Preset pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        LSSupportsOpeningDocumentsInPlace: false
        # F1 passive mode (epic #7 child 6): one BGProcessingTask, external power, no network.
        BGTaskSchedulerPermittedIdentifiers: [com.loupe-ai.ios.sort]
        UIBackgroundModes: [processing]
        # Phone sources (epic #7 child 7), on by default (2026-09-26): asked once in onboarding's permissions step, or by Allow access in Sources.
        NSPhotoLibraryUsageDescription: "Loupe reads your photos on this iPhone to find receipts and documents, including the text in screenshots. Nothing leaves the phone."
        NSCalendarsFullAccessUsageDescription: "Loupe reads your calendar events on this iPhone (titles, times, attendees, repeats) so your judgments and watchers can use them. Nothing leaves the phone, and Loupe never changes an event."
        NSContactsUsageDescription: "Loupe reads names and email addresses on this iPhone so it can warn you when a message uses a contact's name from an address they do not use. Nothing leaves the phone."
        # OAuth mail sign-in. Google from the build settings above; Microsoft EMPTY until the owner
        # registers a client (docs/BUILD.md). While empty the Mail screen says so and offers app-password IMAP.
        LoupeGoogleOAuthClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [$(GOOGLE_IOS_URL_SCHEME)]
        LoupeMicrosoftOAuthClientID: ""
  LoupeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: LoupeShare
      - path: Shared
        excludes: ["Clipboard/**"]
    dependencies:
      # Browsing protection (2026-09-26): a shared link's verdict right in the share sheet, from the
      # same phishing formula (static; only what the checks use is linked).
      - framework: ../loupe-kit/build/XCFrameworks/debug/LoupeKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios.share
        PRODUCT_NAME: LoupeShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: LoupeShare/LoupeShare.entitlements
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        DEAD_CODE_STRIPPING: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: LoupeShare/Info.plist
      properties:
        CFBundleDisplayName: Send to Loupe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
  # Loupe for Safari (2026-09-26): a Safari Web Extension (manifest v3). The content script sends each
  # top-level page's website name to the background script, which asks SafariWebExtensionHandler
  # (Swift, LoupeKit's phishing formula) for a verdict; suspicious and dangerous sites get Loupe's
  # warning over the page. Same App Group as the app: it reads the lists and switches the app keeps.
  LoupeSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: LoupeSafari
        excludes: ["Resources/**"]
      - path: Shared
        excludes: ["Clipboard/**"]
      - path: Loupe/Online/SiteDns.swift
      - path: LoupeSafari/Resources/manifest.json
        buildPhase: resources
      - path: LoupeSafari/Resources/background.js
        buildPhase: resources
      - path: LoupeSafari/Resources/content.js
        buildPhase: resources
      - path: LoupeSafari/Resources/popup.html
        buildPhase: resources
      - path: LoupeSafari/Resources/popup.js
        buildPhase: resources
      - path: LoupeSafari/Resources/popup.css
        buildPhase: resources
      - path: LoupeSafari/Resources/images
        type: folder
        buildPhase: resources
      - path: LoupeSafari/Resources/_locales
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../loupe-kit/build/XCFrameworks/debug/LoupeKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios.safari
        PRODUCT_NAME: LoupeSafari
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: LoupeSafari/LoupeSafari.entitlements
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        DEAD_CODE_STRIPPING: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: LoupeSafari/Info.plist
      properties:
        CFBundleDisplayName: Loupe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
  # The Loupe keyboard (2026-09-26, clipboard checks): a custom keyboard (English and Arabic) with a Loupe
  # strip that checks the link on the clipboard or just pasted, ON THIS IPHONE ONLY. RequestsOpenAccess:
  # reading the clipboard needs "Allow Full Access"; without it the keyboard types and says so.
  # NO NETWORK CODE: only the listed Shared files are compiled (not DomainFactsClient.swift, not
  # SafariVerdicts.swift, not SiteDns.swift); LoupeKit is linked statically and dead-stripped, unused
  # dylibs dropped; scripts/check-no-network.sh fails the build if the linked binary imports any network
  # API; LoupeTests/ClipboardTests greps these sources. Same App Group as the app (Spotted, the lists).
  LoupeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: LoupeKeyboard
      - path: Shared/Clipboard
      - path: Shared/Protection/LinkVerdict.swift
      - path: Shared/Protection/ProtectionGroup.swift
      - path: Shared/Protection/MappedPhishingIndex.swift
      - path: Shared/Protection/ProtectionLists.swift
      - path: Shared/Protection/SpottedLog.swift
      - path: Shared/Protection/OnlineShared.swift
    dependencies:
      - framework: ../loupe-kit/build/XCFrameworks/debug/LoupeKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios.keyboard
        PRODUCT_NAME: LoupeKeyboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: LoupeKeyboard/LoupeKeyboard.entitlements
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-Wl,-dead_strip_dylibs"]
        DEAD_CODE_STRIPPING: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The link-time network check reads the built binary.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Check the keyboard has no network code
        script: |
          "${SRCROOT}/scripts/check-no-network.sh" "${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/${EXECUTABLE_NAME}.debug.dylib"
        basedOnDependencyAnalysis: false
    info:
      path: LoupeKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Loupe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  # "Check copied" (2026-09-26, clipboard checks): a small Home Screen / Lock Screen widget whose button
  # (an iOS 17 interactive widget, App Intent `CheckCopiedIntent`) opens Loupe and checks what was copied.
  # No LoupeKit: it shows the last check's level and time only (from the App Group).
  LoupeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LoupeWidgets
      - path: Shared/Protection/ProtectionGroup.swift
      - path: Shared/Clipboard/ClipboardShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios.widgets
        PRODUCT_NAME: LoupeWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: LoupeWidgets/LoupeWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOUPE_WIDGET"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: LoupeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loupe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LoupeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoupeTests
    dependencies:
      - target: Loupe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios.tests
  LoupeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoupeUITests
    dependencies:
      - target: Loupe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.loupe-ai.ios.uitests
        TEST_TARGET_NAME: Loupe
schemes:
  Loupe:
    build:
      targets:
        Loupe: all
        LoupeTests: [test]
        LoupeUITests: [test]
    test:
      targets: [LoupeTests, LoupeUITests]
      gatherCoverageData: false
